{% extends 'base.html' %}

{% block title %}{{ teacher.name }}{% endblock %}

{% block content %}
    <h1>{{ teacher.name }}</h1>

    <ul class="list-group mb-3">
        <li class="list-group-item"><strong>Subject:</strong> {{ teacher.subject }}</li>
        <li class="list-group-item"><strong>Email:</strong> {{ teacher.email }}</li>
        <li class="list-group-item"><strong>Hired on:</strong> {{ teacher.hire_date }}</li>
    </ul>

    <a href="{% url 'teacher:list' %}" class="btn btn-secondary">Back to teachers</a>
{% endblock %}
