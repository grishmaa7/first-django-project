{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My School{% endblock %}</title>

    <!-- Bootstrap 5 (from a CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our own stylesheet (a static file) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="{% url 'students:home' %}">My School</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'students:home' %}">Home</a>
                <a class="nav-link" href="{% url 'students:list' %}">Students</a>
                <a class="nav-link" href="{% url 'classes:list' %}">Classes</a>
                <a class="nav-link" href="{% url 'students:contact' %}">Contact</a>

                {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'teacher:list' %}">Teachers</a>
                <span class="nav-link text-white-50">
                    Hi, {{ user.username }}
                </span>

                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="nav-link btn btn-link">
                        Log Out
                    </button>
                </form>

                {% else %}
                <a class="nav-link" href="{% url 'login' %}">Log In</a>
                <a class="nav-link" href="{% url 'students:signup' %}">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-4">
        <small>My School &middot; Django Course Project</small>
    </footer>

</body>

</html>
