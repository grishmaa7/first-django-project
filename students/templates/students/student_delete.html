{% extends 'base.html' %}

{% block title %}Delete {{ student.name }} {% endblock %}

{% block content %}
<h1>Delete Student</h1>
<p class="lead">Are you sure you want to delete <strong>{{student.name}}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'students:detail' student.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
